name: build-jeecg

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: 后端版本（标签或分支）
        default: main
      frontend_ref:
        description: 前端分支或标签
        default: master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: owner lowercase
        id: o
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          build-args: BRANCH=${{ inputs.backend_ref }}
          tags: |
            ghcr.io/${{ steps.o.outputs.owner }}/jeecg-backend:${{ inputs.backend_ref }}
            ghcr.io/${{ steps.o.outputs.owner }}/jeecg-backend:latest

      - name: build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: BRANCH=${{ inputs.frontend_ref }}
          tags: |
            ghcr.io/${{ steps.o.outputs.owner }}/jeecg-frontend:latest
